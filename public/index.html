<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lead Analytics — Digitrans</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:1.5rem}
    header{max-width:1100px;margin:0 auto 2rem;display:flex;align-items:center;justify-content:space-between}
    header h1{font-size:1.4rem;font-weight:800;color:#f8fafc}
    .subtitle{font-size:0.8rem;color:#64748b;margin-top:0.2rem}
    .refresh-btn{padding:0.4rem 1rem;background:#1e293b;border:1px solid #334155;color:#94a3b8;border-radius:8px;font-size:0.82rem;cursor:pointer}
    .refresh-btn:hover{border-color:#6366f1;color:#818cf8}
    .last-updated{font-size:0.75rem;color:#475569;margin-top:0.3rem;text-align:right}

    .main{max-width:1100px;margin:0 auto}

    /* Stat cards */
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem}
    .stat{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:1.4rem 1.25rem}
    .stat .num{font-size:2.4rem;font-weight:800;line-height:1}
    .stat .lbl{font-size:0.72rem;color:#64748b;margin-top:0.4rem;text-transform:uppercase;letter-spacing:0.06em}
    .stat .sub{font-size:0.75rem;color:#475569;margin-top:0.5rem}
    .stat.total .num{color:#818cf8}
    .stat.contacted .num{color:#34d399}
    .stat.pending .num{color:#fbbf24}
    .stat.noemail .num{color:#f87171}

    /* Progress bar */
    .progress-card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:1.4rem 1.5rem;margin-bottom:2rem}
    .progress-card h2{font-size:0.8rem;color:#64748b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:1rem}
    .progress-bar-wrap{background:#0f172a;border-radius:999px;height:12px;overflow:hidden;margin-bottom:0.5rem}
    .progress-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,#6366f1,#34d399);transition:width 0.8s ease}
    .progress-labels{display:flex;justify-content:space-between;font-size:0.75rem;color:#64748b}

    /* Table */
    .table-card{background:#1e293b;border:1px solid #334155;border-radius:14px;overflow:hidden}
    .table-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid #334155;flex-wrap:wrap;gap:0.5rem}
    .table-header h2{font-size:0.8rem;color:#64748b;text-transform:uppercase;letter-spacing:0.06em}
    .filters{display:flex;gap:0.4rem}
    .filter-btn{padding:0.28rem 0.7rem;border-radius:6px;border:1px solid #334155;background:transparent;color:#94a3b8;font-size:0.76rem;cursor:pointer}
    .filter-btn.active,.filter-btn:hover{background:#6366f1;border-color:#6366f1;color:#fff}
    .search-input{padding:0.28rem 0.7rem;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:0.8rem;outline:none;width:200px}
    .search-input:focus{border-color:#6366f1}

    table{width:100%;border-collapse:collapse;font-size:0.82rem}
    th{text-align:left;padding:0.55rem 1rem;color:#475569;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid #0f172a}
    td{padding:0.65rem 1rem;border-bottom:1px solid #0f172a;color:#cbd5e1;vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:#ffffff08}

    .badge{display:inline-block;padding:0.18rem 0.55rem;border-radius:999px;font-size:0.68rem;font-weight:700}
    .badge.New{background:#1e3a5f;color:#60a5fa}
    .badge.Contacted{background:#064e3b;color:#34d399}
    .badge.Interested{background:#451a03;color:#fb923c}
    .badge.Replied{background:#2e1065;color:#a78bfa}
    .badge.default{background:#1e293b;color:#94a3b8}

    .empty{text-align:center;padding:3rem;color:#475569}
    .loading{text-align:center;padding:3rem;color:#475569;animation:pulse 1.5s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

    .error-banner{background:#450a0a;border:1px solid #7f1d1d;border-radius:10px;padding:0.85rem 1.25rem;color:#fca5a5;font-size:0.83rem;margin-bottom:1.5rem;display:none}

    @media(max-width:700px){
      .stats{grid-template-columns:repeat(2,1fr)}
      .filters{display:none}
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>📊 Lead Analytics — Digitrans</h1>
    <div class="subtitle">Live data from Frappe CRM</div>
  </div>
  <div style="text-align:right">
    <button class="refresh-btn" onclick="loadAll()">↻ Refresh</button>
    <div class="last-updated" id="lastUpdated">—</div>
  </div>
</header>

<div class="main">

  <div class="error-banner" id="errorBanner"></div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat total">
      <div class="num" id="s-total">—</div>
      <div class="lbl">Total Leads</div>
      <div class="sub" id="s-total-sub">fetching…</div>
    </div>
    <div class="stat contacted">
      <div class="num" id="s-contacted">—</div>
      <div class="lbl">Contacted</div>
      <div class="sub" id="s-contacted-sub">status = Contacted</div>
    </div>
    <div class="stat pending">
      <div class="num" id="s-pending">—</div>
      <div class="lbl">Pending</div>
      <div class="sub" id="s-pending-sub">status = New</div>
    </div>
    <div class="stat noemail">
      <div class="num" id="s-noemail">—</div>
      <div class="lbl">No Email</div>
      <div class="sub">skipped by workflow</div>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-card">
    <h2>Outreach Progress</h2>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
    </div>
    <div class="progress-labels">
      <span id="progressLeft">0 contacted</span>
      <span id="progressRight">0% complete</span>
    </div>
  </div>

  <!-- Table -->
  <div class="table-card">
    <div class="table-header">
      <h2>All Leads</h2>
      <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">
        <input class="search-input" id="searchInput" placeholder="Search name, email, company…" oninput="renderTable()"/>
        <div class="filters">
          <button class="filter-btn active" onclick="setFilter('ALL',this)">All</button>
          <button class="filter-btn" onclick="setFilter('New',this)">New</button>
          <button class="filter-btn" onclick="setFilter('Contacted',this)">Contacted</button>
          <button class="filter-btn" onclick="setFilter('Interested',this)">Interested</button>
        </div>
      </div>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Company</th>
            <th>Status</th>
            <th>Created</th>
          </tr>
        </thead>
        <tbody id="leadsTable">
          <tr><td colspan="7" class="loading">Loading leads from CRM…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  let allLeads = [];
  let activeFilter = 'ALL';

  function setFilter(f, btn) {
    activeFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTable();
  }

  async function loadAll() {
    try {
      document.getElementById('errorBanner').style.display = 'none';
      const res = await fetch('/api/crm/leads');
      if (!res.ok) throw new Error('Server returned ' + res.status);
      const data = await res.json();
      allLeads = data.leads || [];
      updateStats(data.stats || {});
      renderTable();
      document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch (e) {
      showError('Cannot load leads: ' + e.message + '. Make sure npm start is running.');
    }
  }

  function updateStats(s) {
    document.getElementById('s-total').textContent     = s.total     ?? '—';
    document.getElementById('s-contacted').textContent = s.contacted ?? '—';
    document.getElementById('s-pending').textContent   = s.pending   ?? '—';
    document.getElementById('s-noemail').textContent   = s.no_email  ?? '—';

    const pct = s.total > 0 ? Math.round((s.contacted / s.total) * 100) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressLeft').textContent  = (s.contacted ?? 0) + ' contacted';
    document.getElementById('progressRight').textContent = pct + '% complete';

    document.getElementById('s-total-sub').textContent     = s.total + ' total in CRM';
    document.getElementById('s-contacted-sub').textContent = 'out of ' + s.total + ' leads';
    document.getElementById('s-pending-sub').textContent   = (s.pending ?? 0) + ' awaiting outreach';
  }

  function renderTable() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allLeads.filter(l => {
      const matchFilter = activeFilter === 'ALL' || l.status === activeFilter;
      const matchSearch = !search ||
        (l.lead_name  && l.lead_name.toLowerCase().includes(search)) ||
        (l.email      && l.email.toLowerCase().includes(search)) ||
        (l.organization && l.organization.toLowerCase().includes(search));
      return matchFilter && matchSearch;
    });

    const tbody = document.getElementById('leadsTable');
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">No leads found</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map((l, i) => `
      <tr>
        <td style="color:#475569">${i + 1}</td>
        <td><strong style="color:#f1f5f9">${esc(l.lead_name || l.first_name || l.name)}</strong></td>
        <td style="color:#94a3b8">${esc(l.email || '—')}</td>
        <td style="color:#94a3b8">${esc(l.mobile_no || '—')}</td>
        <td style="color:#94a3b8">${esc((l.organization || '—').replace(/\n/g,'').trim())}</td>
        <td><span class="badge ${l.status || 'default'}">${esc(l.status || 'Unknown')}</span></td>
        <td style="color:#475569;font-size:0.75rem">${l.creation ? new Date(l.creation).toLocaleDateString() : '—'}</td>
      </tr>
    `).join('');
  }

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function showError(msg) {
    const b = document.getElementById('errorBanner');
    b.textContent = '⚠️ ' + msg;
    b.style.display = 'block';
  }

  loadAll();
  setInterval(loadAll, 60000); // auto-refresh every minute
</script>
</body>
</html>

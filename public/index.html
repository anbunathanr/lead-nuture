<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nurturio — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a; color: #e2e8f0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .card {
      width: 100%; max-width: 400px;
      background: #1e293b; border: 1px solid #334155;
      border-radius: 18px; padding: 2.5rem 2rem;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .logo { text-align: center; margin-bottom: 2rem; }
    .logo-text { font-size: 2rem; font-weight: 900; color: #f8fafc; letter-spacing: -0.03em; }
    .logo-text span { color: #6366f1; }
    .logo-sub { font-size: 0.82rem; color: #64748b; margin-top: 0.25rem; }
    label { display: block; font-size: 0.72rem; font-weight: 600; color: #94a3b8; margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em; }
    input {
      width: 100%; padding: 0.7rem 0.9rem; background: #0f172a;
      border: 1.5px solid #334155; border-radius: 9px; color: #e2e8f0;
      font-size: 0.9rem; outline: none; transition: border-color 0.2s; margin-bottom: 1rem;
    }
    input:focus { border-color: #6366f1; }
    .btn {
      width: 100%; padding: 0.8rem; background: #6366f1; color: #fff;
      border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; transition: background 0.15s; margin-top: 0.25rem;
    }
    .btn:hover { background: #4f46e5; }
    .btn:disabled { background: #334155; cursor: not-allowed; }
    .error { background: #450a0a; border: 1px solid #f87171; color: #f87171; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.82rem; margin-bottom: 1rem; display: none; }
    .success { background: #052e16; border: 1px solid #4ade80; color: #4ade80; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.82rem; margin-bottom: 1rem; display: none; }
    .otp-inputs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .otp-inputs input { width: 3rem; text-align: center; font-size: 1.3rem; font-weight: 700; letter-spacing: 0.1em; padding: 0.7rem 0.4rem; }
    .back-link { text-align: center; margin-top: 1rem; font-size: 0.8rem; }
    .back-link a { color: #6366f1; cursor: pointer; text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-text"><span>Nurtu</span>rio</div>
    <div class="logo-sub">AI-powered lead nurturing</div>
  </div>

  <div id="error-box" class="error"></div>
  <div id="success-box" class="success"></div>

  <!-- Step 1: Email + Name + Mobile -->
  <div id="step-auth">
    <label>Name</label>
    <input type="text" id="auth-name" placeholder="Your full name" onkeydown="if(event.key==='Enter')document.getElementById('auth-email').focus()"/>
    <label>Email</label>
    <input type="email" id="auth-email" placeholder="you@company.com" onkeydown="if(event.key==='Enter')document.getElementById('auth-mobile').focus()"/>
    <label>Mobile (optional)</label>
    <input type="tel" id="auth-mobile" placeholder="+91 9876543210" onkeydown="if(event.key==='Enter')sendOTP()"/>
    <button class="btn" id="auth-btn" onclick="sendOTP()">Send OTP →</button>
  </div>

  <!-- Step 2: OTP Verification -->
  <div id="step-otp" style="display:none">
    <p style="text-align:center;color:#94a3b8;font-size:0.85rem;margin-bottom:1.25rem;">Enter the 6-digit OTP sent to <strong id="otp-email-display"></strong></p>
    <div class="otp-inputs">
      <input type="text" maxlength="1" id="otp-1" oninput="otpNext(1)" onkeydown="otpBack(event,1)"/>
      <input type="text" maxlength="1" id="otp-2" oninput="otpNext(2)" onkeydown="otpBack(event,2)"/>
      <input type="text" maxlength="1" id="otp-3" oninput="otpNext(3)" onkeydown="otpBack(event,3)"/>
      <input type="text" maxlength="1" id="otp-4" oninput="otpNext(4)" onkeydown="otpBack(event,4)"/>
      <input type="text" maxlength="1" id="otp-5" oninput="otpNext(5)" onkeydown="otpBack(event,5)"/>
      <input type="text" maxlength="1" id="otp-6" oninput="otpNext(6)" onkeydown="otpBack(event,6)"/>
    </div>
    <button class="btn" id="verify-btn" onclick="verifyOTP()">Verify & Sign In →</button>
    <div class="back-link"><a onclick="showStep('auth')">← Back</a></div>
  </div>
</div>

<script>
  const API = 'https://1pqeziijq3.execute-api.us-east-1.amazonaws.com';
  let pendingEmail = '';

  function showError(msg) { const b = document.getElementById('error-box'); b.textContent = '✕ ' + msg; b.style.display = 'block'; document.getElementById('success-box').style.display = 'none'; }
  function showSuccess(msg) { const b = document.getElementById('success-box'); b.textContent = '✓ ' + msg; b.style.display = 'block'; document.getElementById('error-box').style.display = 'none'; }
  function hideMessages() { document.getElementById('error-box').style.display = 'none'; document.getElementById('success-box').style.display = 'none'; }

  function showStep(step) {
    hideMessages();
    document.getElementById('step-auth').style.display = step === 'auth' ? '' : 'none';
    document.getElementById('step-otp').style.display = step === 'otp' ? '' : 'none';
  }

  function setLoading(btnId, loading) {
    const b = document.getElementById(btnId);
    b.disabled = loading;
    b.textContent = loading ? '⏳ Please wait…' : b.dataset.label;
  }

  // OTP input helpers
  function otpNext(i) { if (document.getElementById('otp-' + i).value && i < 6) document.getElementById('otp-' + (i + 1)).focus(); }
  function otpBack(e, i) { if (e.key === 'Backspace' && !document.getElementById('otp-' + i).value && i > 1) document.getElementById('otp-' + (i - 1)).focus(); }
  function getOTP() { let otp = ''; for (let i = 1; i <= 6; i++) otp += document.getElementById('otp-' + i).value; return otp; }

  async function sendOTP() {
    hideMessages();
    const name = document.getElementById('auth-name').value.trim();
    const email = document.getElementById('auth-email').value.trim();
    const mobile = document.getElementById('auth-mobile').value.trim();
    if (!name) { showError('Please enter your name'); return; }
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('Please enter a valid email'); return; }

    const btn = document.getElementById('auth-btn');
    btn.dataset.label = 'Send OTP →';
    setLoading('auth-btn', true);
    try {
      const res = await fetch(API + '/api/customer/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, name, mobile }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to send OTP');
      pendingEmail = email;
      document.getElementById('otp-email-display').textContent = email;
      showStep('otp');
      showSuccess('OTP sent! Check your email inbox.');
      document.getElementById('otp-1').focus();
    } catch (e) { showError(e.message); }
    setLoading('auth-btn', false);
  }

  async function verifyOTP() {
    hideMessages();
    const otp = getOTP();
    if (otp.length !== 6) { showError('Please enter the complete 6-digit OTP'); return; }

    const btn = document.getElementById('verify-btn');
    btn.dataset.label = 'Verify & Sign In →';
    setLoading('verify-btn', true);
    try {
      const res = await fetch(API + '/api/customer/verify-otp', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: pendingEmail, otp }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Verification failed');
      sessionStorage.setItem('nurturio_user', JSON.stringify({ email: pendingEmail, company_name: data.company_name }));
      if (data.token) localStorage.setItem('nurturio_customer_token', data.token);
      window.location.href = '/dashboard.html';
    } catch (e) { showError(e.message); }
    setLoading('verify-btn', false);
  }

  // Handle paste of full OTP
  document.getElementById('otp-1').addEventListener('paste', (e) => {
    const text = (e.clipboardData || window.clipboardData).getData('text').trim();
    if (/^\d{6}$/.test(text)) {
      e.preventDefault();
      for (let i = 0; i < 6; i++) document.getElementById('otp-' + (i + 1)).value = text[i];
      document.getElementById('otp-6').focus();
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nurturio — Admin Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    /* Layout */
    .header { background: #1e293b; border-bottom: 1px solid #334155; padding: 0 2rem; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .header-logo { font-size: 1.2rem; font-weight: 900; color: #f8fafc; letter-spacing: -0.02em; }
    .header-logo span { color: #6366f1; }
    .header-right { display: flex; align-items: center; gap: 1rem; }
    .badge { background: #1e3a5f; border: 1px solid #3b82f6; color: #93c5fd; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
    .logout-btn { background: transparent; border: 1px solid #334155; color: #64748b; padding: 0.4rem 0.85rem; border-radius: 8px; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; }
    .logout-btn:hover { border-color: #f87171; color: #f87171; }

    .main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* Stats bar */
    .stats-bar { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1rem 1.5rem; flex: 1; min-width: 140px; }
    .stat-value { font-size: 1.8rem; font-weight: 800; color: #f8fafc; }
    .stat-label { font-size: 0.75rem; color: #64748b; margin-top: 0.2rem; text-transform: uppercase; letter-spacing: 0.05em; }

    /* Section header */
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .section-title { font-size: 1rem; font-weight: 700; color: #f8fafc; }
    .refresh-btn { background: transparent; border: 1px solid #334155; color: #64748b; padding: 0.4rem 0.85rem; border-radius: 8px; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; }
    .refresh-btn:hover { border-color: #6366f1; color: #6366f1; }

    /* Customer cards */
    .customer-grid { display: grid; gap: 1rem; }
    .customer-card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 1.25rem 1.5rem; transition: border-color 0.15s; }
    .customer-card:hover { border-color: #475569; }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 0.85rem; }
    .card-name { font-size: 1rem; font-weight: 700; color: #f8fafc; }
    .card-email { font-size: 0.8rem; color: #64748b; margin-top: 0.2rem; }
    .status-badge { padding: 0.2rem 0.65rem; border-radius: 999px; font-size: 0.72rem; font-weight: 700; white-space: nowrap; }
    .status-active { background: #064e3b; color: #34d399; border: 1px solid #065f46; }
    .status-inactive { background: #1e293b; color: #64748b; border: 1px solid #334155; }
    .card-meta { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; margin-bottom: 1rem; }
    .meta-item { font-size: 0.78rem; color: #94a3b8; }
    .meta-item a { color: #6366f1; text-decoration: none; }
    .meta-item a:hover { text-decoration: underline; }
    .meta-label { color: #475569; font-size: 0.72rem; display: block; margin-bottom: 0.1rem; }
    .card-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .dl-btn { background: #6366f1; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: background 0.15s; display: flex; align-items: center; gap: 0.4rem; }
    .dl-btn:hover { background: #4f46e5; }
    .dl-btn:disabled { background: #334155; cursor: not-allowed; }

    /* Empty state */
    .empty { text-align: center; padding: 4rem 2rem; color: #475569; }
    .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty-text { font-size: 0.9rem; }

    /* Loading spinner */
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #334155; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; padding: 0.85rem 1.25rem; border-radius: 10px; font-size: 0.875rem; font-weight: 600; box-shadow: 0 4px 24px rgba(0,0,0,0.4); max-width: 360px; display: none; }
    .toast.success { background: #064e3b; border: 1px solid #34d399; color: #34d399; }
    .toast.error   { background: #450a0a; border: 1px solid #f87171; color: #f87171; }

    /* Search */
    .search-input { background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; padding: 0.5rem 0.85rem; font-size: 0.875rem; outline: none; width: 220px; transition: border-color 0.15s; }
    .search-input:focus { border-color: #6366f1; }
    .search-input::placeholder { color: #475569; }

    @media (max-width: 600px) {
      .header { padding: 0 1rem; }
      .main { padding: 1.25rem 1rem; }
      .stats-bar { gap: 0.75rem; }
      .card-top { flex-direction: column; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-logo"><span>Nurtu</span>rio <span style="font-size:0.7rem;color:#475569;font-weight:400;margin-left:0.5rem">Admin</span></div>
  <div class="header-right">
    <span class="badge" id="total-badge">Loading…</span>
    <button class="logout-btn" onclick="logout()">Sign Out</button>
  </div>
</header>

<!-- Main -->
<main class="main">

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-value" id="stat-total">—</div>
      <div class="stat-label">Total Companies</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-active">—</div>
      <div class="stat-label">Active</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-today">—</div>
      <div class="stat-label">Joined Today</div>
    </div>
  </div>

  <!-- Section header -->
  <div class="section-header">
    <div class="section-title">Registered Companies</div>
    <div style="display:flex;gap:0.6rem;align-items:center">
      <input class="search-input" id="search" placeholder="Search companies…" oninput="filterCards()" />
      <button class="refresh-btn" onclick="loadCustomers()">↻ Refresh</button>
    </div>
  </div>

  <!-- Customer list -->
  <div id="customer-list">
    <div class="empty">
      <div class="spinner"></div>
      <div class="empty-text" style="margin-top:1rem">Loading customers…</div>
    </div>
  </div>

</main>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const API = 'https://1pqeziijq3.execute-api.us-east-1.amazonaws.com';

  // Get stored admin token from localStorage
  function getAuthHeaders() {
    const token = localStorage.getItem('nurturio_admin_token');
    return token ? { 'Authorization': 'Bearer ' + token } : {};
  }

  /* ── Auth check ── */
  (async function checkAuth() {
    const token = localStorage.getItem('nurturio_admin_token');
    if (!token) { window.location.href = 'login.html'; return; }
    try {
      const res = await fetch(API + '/api/admin/customers', { headers: getAuthHeaders() });
      if (res.status === 401) {
        localStorage.removeItem('nurturio_admin_token');
        window.location.href = 'login.html';
      }
    } catch {
      window.location.href = 'login.html';
    }
  })();

  let allCustomers = [];

  /* ── Load customers ── */
  async function loadCustomers() {
    document.getElementById('customer-list').innerHTML = `
      <div class="empty">
        <div class="spinner"></div>
        <div class="empty-text" style="margin-top:1rem">Loading…</div>
      </div>`;

    try {
      const res = await fetch(API + '/api/admin/customers', { headers: getAuthHeaders() });
      if (res.status === 401) { localStorage.removeItem('nurturio_admin_token'); window.location.href = 'login.html'; return; }
      if (!res.ok) throw new Error('Failed to load customers');
      const data = await res.json();
      allCustomers = data.customers || [];
      renderStats(allCustomers);
      renderCards(allCustomers);
    } catch (e) {
      document.getElementById('customer-list').innerHTML = `
        <div class="empty">
          <div class="empty-icon">⚠️</div>
          <div class="empty-text">${e.message}</div>
        </div>`;
    }
  }

  /* ── Stats ── */
  function renderStats(customers) {
    const total  = customers.length;
    const active = customers.filter(c => c.status === 'active').length;
    const today  = customers.filter(c => {
      if (!c.registered_at) return false;
      const d = new Date(c.registered_at);
      const now = new Date();
      return d.toDateString() === now.toDateString();
    }).length;

    document.getElementById('stat-total').textContent  = total;
    document.getElementById('stat-active').textContent = active;
    document.getElementById('stat-today').textContent  = today;
    document.getElementById('total-badge').textContent = total + ' companies';
  }

  /* ── Filter ── */
  function filterCards() {
    const q = document.getElementById('search').value.toLowerCase();
    const filtered = allCustomers.filter(c =>
      (c.company_name || '').toLowerCase().includes(q) ||
      (c.email || '').toLowerCase().includes(q) ||
      (c.company_url || '').toLowerCase().includes(q)
    );
    renderCards(filtered);
  }

  /* ── Render cards ── */
  function renderCards(customers) {
    const list = document.getElementById('customer-list');
    if (!customers.length) {
      list.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🏢</div>
          <div class="empty-text">No companies registered yet.</div>
        </div>`;
      return;
    }

    list.innerHTML = '<div class="customer-grid">' +
      customers.map(c => customerCard(c)).join('') +
      '</div>';
  }

  function calcPct(c) {
    const fields = ['company_name','company_url','booking_url','crm_base_url','crm_user','crm_password','smtp_user','smtp_pass'];
    const weights = [10,10,10,20,10,10,10,10]; // = 90, + 10 for kb_trained = 100
    let done = 0;
    // For admin view: passwords are redacted as ••••••••, but if they exist at all count them
    fields.forEach((f,i) => { if (c[f] && String(c[f]).trim()) done += weights[i]; });
    if (c.kb_trained) done += 10;
    return Math.min(100, done);
  }

  function customerCard(c) {
    const statusClass = c.status === 'active' ? 'status-active' : 'status-inactive';
    const statusLabel = c.status === 'active' ? '● Active' : '○ Inactive';
    const regDate = c.registered_at
      ? new Date(c.registered_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })
      : '—';
    const updatedDate = c.updated_at
      ? new Date(c.updated_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })
      : '—';
    const emailEnc = encodeURIComponent(c.email || '');
    const pct = calcPct(c);
    const pctColor = pct === 100 ? '#34d399' : pct >= 60 ? '#fbbf24' : '#f87171';

    return `
      <div class="customer-card">
        <div class="card-top">
          <div>
            <div class="card-name">${esc(c.company_name || 'Unnamed Company')}</div>
            <div class="card-email">${esc(c.email || '')}</div>
          </div>
          <div style="display:flex;align-items:center;gap:0.75rem">
            <div style="text-align:center">
              <div style="font-size:1.1rem;font-weight:800;color:${pctColor}">${pct}%</div>
              <div style="font-size:0.65rem;color:#64748b;text-transform:uppercase;letter-spacing:0.05em">profile</div>
            </div>
            <span class="status-badge ${statusClass}">${statusLabel}</span>
          </div>
        </div>
        <div style="background:#0f172a;border-radius:4px;height:4px;margin-bottom:1rem;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${pctColor};border-radius:4px;transition:width 0.4s"></div>
        </div>
        <div class="card-meta">
          ${c.company_url ? `<div class="meta-item"><span class="meta-label">Website</span><a href="${esc(c.company_url)}" target="_blank" rel="noopener">${esc(c.company_url)}</a></div>` : ''}
          ${c.crm_base_url ? `<div class="meta-item"><span class="meta-label">CRM URL</span>${esc(c.crm_base_url)}</div>` : ''}
          <div class="meta-item"><span class="meta-label">Registered</span>${regDate}</div>
          <div class="meta-item"><span class="meta-label">Last Updated</span>${updatedDate}</div>
          ${c.leads_per_run ? `<div class="meta-item"><span class="meta-label">Leads/Run</span>${esc(c.leads_per_run)}</div>` : ''}
          ${c.kb_trained
            ? `<div class="meta-item"><span class="meta-label">Knowledge Base</span><span style="color:#34d399">✓ Trained</span></div>`
            : `<div class="meta-item"><span class="meta-label">Knowledge Base</span><span style="color:#f87171">✗ Not trained</span></div>`}
        </div>
        <div class="card-actions">
          <button class="dl-btn" onclick="downloadWorkflow('${emailEnc}', 'lead-nurturing', this)" title="Lead Nurturing workflow">
            ⬇️ Lead Nurturing
          </button>
          <button class="dl-btn" onclick="downloadWorkflow('${emailEnc}', 'email-reply', this)" title="Email AI Reply workflow" style="background:#0f4c81;color:#93c5fd">
            ⬇️ Email Reply
          </button>
          <button class="dl-btn" onclick="window.open('/chatbot-widget.html?company=' + '${emailEnc}', '_blank')" title="Test chatbot for this company" style="background:#1e1b4b;color:#a5b4fc;border:1px solid #4f46e5">
            💬 Chat Test
          </button>
        </div>
      </div>`;
  }

  /* ── Download workflow ── */
  async function downloadWorkflow(emailEnc, type, btn) {
    btn.disabled = true;
    btn.textContent = '⏳ …';
    try {
      const res = await fetch(API + '/api/admin/customers/' + emailEnc + '/workflow?type=' + type, { headers: getAuthHeaders() });
      if (res.status === 401) { localStorage.removeItem('nurturio_admin_token'); window.location.href = 'login.html'; return; }
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        throw new Error(d.error || 'Download failed');
      }
      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url;
      a.download = decodeURIComponent(emailEnc).replace(/[@.]/g, '-') + '-' + type + '-workflow.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast(type + ' workflow downloaded!', 'success');
    } catch (e) {
      showToast(e.message, 'error');
    }
    btn.disabled = false;
    btn.innerHTML = '⬇️ ' + (type === 'lead-nurturing' ? 'Lead Nurturing' : type === 'email-reply' ? 'Email Reply' : 'Telegram Bot');
  }

  /* ── Logout ── */
  async function logout() {
    await fetch(API + '/api/admin/logout', { method: 'POST', headers: getAuthHeaders() }).catch(() => {});
    localStorage.removeItem('nurturio_admin_token');
    window.location.href = 'login.html';
  }

  /* ── Toast ── */
  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = (type === 'success' ? '✓ ' : '✕ ') + msg;
    t.className = 'toast ' + type;
    t.style.display = 'block';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.display = 'none'; }, 4000);
  }

  /* ── HTML escape ── */
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ── Init ── */
  loadCustomers();
</script>
</body>
</html>

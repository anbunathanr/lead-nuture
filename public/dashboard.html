<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — LeadFlow</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:1.5rem}

    header{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto 1.5rem}
    header h1{font-size:1.3rem;font-weight:800;color:#f8fafc}
    header span{color:#64748b;font-size:0.85rem}
    .new-lead-btn{padding:0.45rem 1rem;background:#6366f1;color:#fff;border:none;border-radius:8px;font-size:0.85rem;font-weight:600;cursor:pointer;text-decoration:none}
    .new-lead-btn:hover{background:#4f46e5}

    .main{max-width:1200px;margin:0 auto}

    /* Stats */
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem}
    .stat{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:1.25rem}
    .stat .num{font-size:2rem;font-weight:800;line-height:1}
    .stat .lbl{font-size:0.75rem;color:#64748b;margin-top:0.3rem;text-transform:uppercase;letter-spacing:0.05em}
    .stat.total .num{color:#818cf8}
    .stat.hot   .num{color:#f87171}
    .stat.warm  .num{color:#fb923c}
    .stat.cold  .num{color:#60a5fa}

    /* Table */
    .table-card{background:#1e293b;border:1px solid #334155;border-radius:12px;overflow:hidden}
    .table-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid #334155}
    .table-header h2{font-size:0.9rem;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em}

    .filters{display:flex;gap:0.5rem}
    .filter-btn{padding:0.3rem 0.75rem;border-radius:6px;border:1px solid #334155;background:transparent;color:#94a3b8;font-size:0.78rem;cursor:pointer;transition:all 0.15s}
    .filter-btn:hover,.filter-btn.active{background:#6366f1;border-color:#6366f1;color:#fff}

    .search-input{padding:0.3rem 0.75rem;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:0.82rem;outline:none;width:180px}
    .search-input:focus{border-color:#6366f1}

    .refresh-btn{padding:0.3rem 0.75rem;border-radius:6px;border:1px solid #334155;background:transparent;color:#94a3b8;font-size:0.78rem;cursor:pointer}
    .refresh-btn:hover{border-color:#6366f1;color:#818cf8}

    table{width:100%;border-collapse:collapse;font-size:0.83rem}
    th{text-align:left;padding:0.6rem 1rem;color:#475569;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid #0f172a}
    td{padding:0.7rem 1rem;border-bottom:1px solid #0f172a;color:#cbd5e1;vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:#0f172a55}

    .badge{display:inline-block;padding:0.2rem 0.6rem;border-radius:999px;font-size:0.7rem;font-weight:700;letter-spacing:0.04em}
    .badge.HOT {background:#450a0a;color:#f87171}
    .badge.WARM{background:#431407;color:#fb923c}
    .badge.COLD{background:#0c1a2e;color:#60a5fa}

    .tag{display:inline-block;padding:0.15rem 0.5rem;border-radius:4px;font-size:0.7rem;background:#1e293b;border:1px solid #334155;color:#94a3b8;margin:0.1rem}

    .empty{text-align:center;padding:3rem;color:#475569}

    @media(max-width:768px){
      .stats{grid-template-columns:repeat(2,1fr)}
      .filters{display:none}
    }
  </style>
</head>
<body>

<header>
  <h1>🎯 LeadFlow Dashboard</h1>
  <div style="display:flex;align-items:center;gap:1rem">
    <span id="lastUpdated"></span>
    <a href="/" class="new-lead-btn">+ New Lead</a>
  </div>
</header>

<div class="main">

  <!-- Stats -->
  <div class="stats">
    <div class="stat total"><div class="num" id="s-total">—</div><div class="lbl">Total Leads</div></div>
    <div class="stat hot">  <div class="num" id="s-hot">—</div>  <div class="lbl">🔥 Hot</div></div>
    <div class="stat warm"> <div class="num" id="s-warm">—</div> <div class="lbl">🟠 Warm</div></div>
    <div class="stat cold"> <div class="num" id="s-cold">—</div> <div class="lbl">🔵 Cold</div></div>
  </div>

  <!-- Table -->
  <div class="table-card">
    <div class="table-header">
      <h2>All Leads</h2>
      <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">
        <input class="search-input" id="searchInput" placeholder="Search name or email…" oninput="renderTable()"/>
        <div class="filters">
          <button class="filter-btn active" onclick="setFilter('ALL',this)">All</button>
          <button class="filter-btn" onclick="setFilter('HOT',this)">🔥 Hot</button>
          <button class="filter-btn" onclick="setFilter('WARM',this)">🟠 Warm</button>
          <button class="filter-btn" onclick="setFilter('COLD',this)">🔵 Cold</button>
        </div>
        <button class="refresh-btn" onclick="loadAll()">↻ Refresh</button>
      </div>
    </div>

    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Company</th>
            <th>Product</th>
            <th>Role</th>
            <th>Logins</th>
            <th>Status</th>
            <th>Added</th>
          </tr>
        </thead>
        <tbody id="leadsTable">
          <tr><td colspan="8" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  let allLeads = [];
  let activeFilter = 'ALL';

  function setFilter(f, btn) {
    activeFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTable();
  }

  async function loadStats() {
    try {
      const r = await fetch('/api/stats');
      const d = await r.json();
      document.getElementById('s-total').textContent = d.total ?? '—';
      document.getElementById('s-hot').textContent   = d.hot   ?? '—';
      document.getElementById('s-warm').textContent  = d.warm  ?? '—';
      document.getElementById('s-cold').textContent  = d.cold  ?? '—';
    } catch {}
  }

  async function loadAll() {
    try {
      const r = await fetch('/api/leads');
      allLeads = await r.json();
      renderTable();
      document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch {
      document.getElementById('leadsTable').innerHTML =
        '<tr><td colspan="8" class="empty" style="color:#f87171">Cannot reach server — is it running?</td></tr>';
    }
  }

  function renderTable() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allLeads.filter(l => {
      const matchFilter = activeFilter === 'ALL' || l.lead_status === activeFilter;
      const matchSearch = !search ||
        (l.name  && l.name.toLowerCase().includes(search)) ||
        (l.email && l.email.toLowerCase().includes(search)) ||
        (l.company && l.company.toLowerCase().includes(search));
      return matchFilter && matchSearch;
    });

    const tbody = document.getElementById('leadsTable');
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty">No leads found</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(l => `
      <tr>
        <td><strong style="color:#f1f5f9">${esc(l.name)}</strong>${l.role ? `<br><span style="color:#475569;font-size:0.72rem">${esc(l.role)}</span>` : ''}</td>
        <td>${esc(l.email)}</td>
        <td>${l.company ? `<strong>${esc(l.company)}</strong>${l.company_size ? `<br><span style="color:#475569;font-size:0.72rem">${esc(l.company_size)} people</span>` : ''}` : '—'}</td>
        <td>${l.product ? `<span class="tag">${esc(l.product)}</span>` : '—'}</td>
        <td style="color:#94a3b8">${esc(l.role || '—')}</td>
        <td style="text-align:center;font-weight:700;color:#818cf8">${l.login_count}</td>
        <td><span class="badge ${l.lead_status}">${l.lead_status}</span></td>
        <td style="color:#475569;font-size:0.78rem">${new Date(l.created_at).toLocaleString()}</td>
      </tr>
    `).join('');
  }

  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  loadStats();
  loadAll();
  setInterval(() => { loadStats(); loadAll(); }, 30000);
</script>
</body>
</html>

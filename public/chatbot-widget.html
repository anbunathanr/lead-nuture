<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }

    .widget {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      background: #0f172a;
    }

    /* Header */
    .header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }
    .header-avatar {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .header-info { flex: 1; min-width: 0; }
    .header-name { font-size: 0.9rem; font-weight: 700; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-status { font-size: 0.7rem; color: #34d399; margin-top: 0.1rem; }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

    .msg {
      display: flex;
      gap: 0.5rem;
      max-width: 85%;
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }

    .msg-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg.bot  .msg-avatar { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
    .msg.user .msg-avatar { background: #334155; }

    .msg-bubble {
      padding: 0.6rem 0.9rem;
      border-radius: 14px;
      font-size: 0.85rem;
      line-height: 1.55;
      word-break: break-word;
    }
    .msg.bot  .msg-bubble { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; border-bottom-left-radius: 4px; }
    .msg.user .msg-bubble { background: #6366f1; color: #fff; border-bottom-right-radius: 4px; }

    .msg-time { font-size: 0.65rem; color: #475569; margin-top: 0.25rem; text-align: right; }
    .msg.bot .msg-time { text-align: left; }

    /* Typing indicator */
    .typing { display: flex; gap: 4px; align-items: center; padding: 0.6rem 0.9rem; }
    .typing span {
      width: 7px; height: 7px;
      background: #64748b;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Input area */
    .input-area {
      background: #1e293b;
      border-top: 1px solid #334155;
      padding: 0.85rem 1rem;
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
      flex-shrink: 0;
    }
    .input-wrap { flex: 1; position: relative; }
    textarea {
      width: 100%;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 12px;
      color: #e2e8f0;
      font-family: inherit;
      font-size: 0.875rem;
      padding: 0.6rem 0.85rem;
      resize: none;
      outline: none;
      max-height: 120px;
      min-height: 42px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #6366f1; }
    textarea::placeholder { color: #475569; }

    .send-btn {
      width: 42px; height: 42px;
      background: #6366f1;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .send-btn:hover { background: #4f46e5; }
    .send-btn:disabled { background: #334155; cursor: not-allowed; }

    /* Welcome message */
    .welcome {
      text-align: center;
      padding: 2rem 1rem;
      color: #475569;
    }
    .welcome-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    .welcome-text { font-size: 0.82rem; line-height: 1.6; }

    /* Error */
    .error-msg { color: #f87171; font-size: 0.78rem; padding: 0.4rem 0.9rem; }
  </style>
</head>
<body>
<div class="widget">
  <!-- Header -->
  <div class="header">
    <div class="header-avatar">🤖</div>
    <div class="header-info">
      <div class="header-name" id="company-name">AI Assistant</div>
      <div class="header-status">● Online</div>
    </div>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="welcome">
      <div class="welcome-icon">💬</div>
      <div class="welcome-text">Hi! I'm your AI assistant.<br>Ask me anything about our products and services.</div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-wrap">
      <textarea
        id="msg-input"
        placeholder="Type a message…"
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
    </div>
    <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send">
      ➤
    </button>
  </div>
</div>

<script>
  // Get company email from URL param
  const params = new URLSearchParams(window.location.search);
  const companyEmail = params.get('company') || '';
  const sessionId = 'sess_' + Math.random().toString(36).slice(2);

  // Set company name in header (will be updated from API if available)
  if (companyEmail) {
    fetch('/api/customer/profile?email=' + encodeURIComponent(companyEmail))
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (data && data.company_name) {
          document.getElementById('company-name').textContent = data.company_name + ' — AI Assistant';
          document.title = data.company_name + ' Chat';
        }
      })
      .catch(() => {});
  }

  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('msg-input');
  const sendBtn    = document.getElementById('send-btn');
  let isTyping = false;

  function formatTime() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function appendMessage(role, text) {
    // Remove welcome message on first real message
    const welcome = messagesEl.querySelector('.welcome');
    if (welcome) welcome.remove();

    const div = document.createElement('div');
    div.className = 'msg ' + role;

    const avatar = role === 'bot' ? '🤖' : '👤';
    const escapedText = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');

    div.innerHTML = `
      <div class="msg-avatar">${avatar}</div>
      <div>
        <div class="msg-bubble">${escapedText}</div>
        <div class="msg-time">${formatTime()}</div>
      </div>`;

    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.id = 'typing-indicator';
    div.innerHTML = `
      <div class="msg-avatar">🤖</div>
      <div class="msg-bubble typing">
        <span></span><span></span><span></span>
      </div>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isTyping) return;

    inputEl.value = '';
    autoResize(inputEl);
    appendMessage('user', text);

    isTyping = true;
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch('/api/chat/widget', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, sessionId, companyEmail }),
      });
      const data = await res.json();
      removeTyping();
      if (!res.ok) throw new Error(data.error || 'Something went wrong');
      appendMessage('bot', data.reply || 'Sorry, I could not generate a response.');
    } catch (err) {
      removeTyping();
      appendMessage('bot', '⚠️ ' + err.message);
    }

    isTyping = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }
</script>
</body>
</html>

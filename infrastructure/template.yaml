AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Nurturio - AI Lead Nurturing SaaS (Serverless, no CloudFront)

Parameters:
  AdminPassword:
    Type: String
    Default: nurturio-admin-2024
    NoEcho: true
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
  Environment:
    Type: String
    Default: prod
    AllowedValues: [prod, dev]

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        CUSTOMERS_TABLE: !Ref CustomersTable
        SESSIONS_TABLE: !Ref SessionsTable
        NUDGE_TABLE: !Ref NudgeTable
        KB_BUCKET: !Ref KBBucket
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'

Resources:

  # DynamoDB Tables

  CustomersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub nurturio-customers-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub nurturio-sessions-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: token
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires
        Enabled: true

  NudgeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub nurturio-nudge-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: leadId
          AttributeType: S
      KeySchema:
        - AttributeName: leadId
          KeyType: HASH

  # S3 Buckets

  KBBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub nurturio-kb-${AWS::AccountId}-${Environment}

  StaticBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub nurturio-static-${AWS::AccountId}-${Environment}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  StaticBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${StaticBucket.Arn}/*

  # SSM Parameters

  AdminPasswordParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /nurturio/admin-password
      Type: String
      Value: !Ref AdminPassword

  BedrockModelParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /nurturio/bedrock-model-id
      Type: String
      Value: !Ref BedrockModelId

  # IAM Role

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: NurturioLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt CustomersTable.Arn
                  - !GetAtt SessionsTable.Arn
                  - !GetAtt NudgeTable.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt KBBucket.Arn
                  - !Sub ${KBBucket.Arn}/*
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: '*'
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nurturio/*

  # Lambda Functions

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub nurturio-api-${Environment}
      CodeUri: ../lambda/
      Handler: api-handler.handler
      Role: !GetAtt LambdaRole.Arn
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        RootEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY

  ImapPollerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub nurturio-imap-poller-${Environment}
      CodeUri: ../lambda/
      Handler: imap-poller.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 120
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Name: !Sub nurturio-imap-schedule-${Environment}
            Enabled: true

  # API Gateway

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub nurturio-api-${Environment}
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - Content-Type
          - Cookie
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowCredentials: false

Outputs:
  ApiUrl:
    Description: API Gateway URL — use this in your n8n workflows
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com

  StaticWebsiteUrl:
    Description: S3 static website URL — your app URL
    Value: !Sub http://${StaticBucket}.s3-website-${AWS::Region}.amazonaws.com

  StaticBucketName:
    Description: S3 bucket for static files
    Value: !Ref StaticBucket

  KBBucketName:
    Description: S3 bucket for knowledge bases
    Value: !Ref KBBucket

  CustomersTableName:
    Description: DynamoDB customers table
    Value: !Ref CustomersTable
